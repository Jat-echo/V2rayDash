name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: v2ray_dash_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v2ray_dash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/v2ray_dash_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum
      - run: go test ./... -count=1 -v
        working-directory: backend
      - run: go build ./cmd/server
        working-directory: backend
      - name: Verify configuration publish and rollback
        run: python3 -m unittest discover -s backend/internal/service -p 'node_*test.py' -v
      - run: go test ./...
        working-directory: agent
      - run: go build ./cmd/agent
        working-directory: agent
      - name: Cross-compile Windows control center
        run: GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/v2ray-dash.exe" ./cmd/server
        working-directory: backend
